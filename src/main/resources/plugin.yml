name: EAuctions
version: 1.0.0
main: com.elyther.eauctions.EAuctions
api-version: '1.21'

author: Elyther
description: Modern Vault-supported Auction House plugin.

depend:
  - Vault

commands:

  ah:
    description: Open the Auction House
    usage: /ah [item|sell|reload]
    aliases:
      - auction
      - auctions

permissions:

  eauctions.use:
    description: Allows the player to use the Auction House
    default: true

  eauctions.sell:
    description: Allows the player to sell items
    default: true

  eauctions.reload:
    description: Allows the player to reload EAuctions
    default: op
